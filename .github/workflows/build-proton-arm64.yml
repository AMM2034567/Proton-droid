name: Build Proton 11 ARM64

on:
  workflow_dispatch:
    inputs:
      proton_branch:
        description: "Proton 分支 (默认 proton_11.0)"
        required: true
        default: "proton_11.0"
      build_name:
        description: "自定义构建名称"
        required: true
        default: "proton-droid-arm64"

# 赋予创建 Release 和上传产物的写入权限
permissions:
  contents: write

# 限制并发，防止多次触发挤占资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build Proton on Native Linux ARM64
    # 必须是公开仓库，免费使用原生 4-core ARM64 Runner (145GB SSD / 16GB RAM)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360 # GitHub 最大 6 小时限制

    steps:
      - name: 检出本项目 (Proton-droid 核心脚本)
        uses: actions/checkout@v4

      - name: 深度清理磁盘空间 (腾出 100GB+ 空间)
        run: |
          echo "=== 正在清理 Runner 预装冗余组件 ==="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/boost || true
          docker image prune -a -f || true
          sudo apt-get clean || true
          echo "=== 清理后磁盘可用空间 ==="
          df -h

      - name: 配置额外 10GB Swap 虚拟内存 (防止链接期 OOM)
        run: |
          echo "=== 配置 Swap 交换分区 ==="
          # 使用独立 swapfile_extra，避免与已有 swapfile 发生冲突
          sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: 安装宿主机必要构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y make rsync git curl

      - name: 浅克隆 Valve Proton 源码 (包含完整子模块)
        run: |
          BRANCH="${{ github.event.inputs.proton_branch || 'proton_11.0' }}"
          echo "=== 高速浅克隆 Proton 源码 (分支: $BRANCH) ==="
          mkdir -p "$GITHUB_WORKSPACE/build-area"
          cd "$GITHUB_WORKSPACE/build-area"
          
          # 使用浅克隆大幅降低传输与磁盘占用
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            -b "$BRANCH" \
            https://github.com/ValveSoftware/Proton.git proton-source

          # 修复浅克隆缺失 tag 导致的 git describe 致命报错 (Error 128)
          echo "=== 为子模块修补 git tag 防御 ==="
          git -C proton-source tag -f proton-11.0-droid || true
          if [ -d proton-source/FEX ]; then
            git -C proton-source/FEX tag -f fex-v2503 || true
          fi

          # 为 Makefile.in 中的 git describe 加上容错参数
          sed -i 's/git -C \$(SRCDIR)\/FEX describe --abbrev=7/git -C \$(SRCDIR)\/FEX describe --always --abbrev=7/g' proton-source/Makefile.in
          sed -i 's/git describe --tags/git describe --tags --always || echo proton-11.0-arm64/g' proton-source/Makefile.in

      - name: 预拉取 Valve 官方 SteamRT4 ARM64 SDK 镜像
        run: |
          SDK_IMAGE="registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm:4.0.20260331.220802-2"
          echo "=== 正在拉取 SteamRT4 SDK 镜像: $SDK_IMAGE ==="
          docker pull "$SDK_IMAGE"

      - name: 配置与原生 ARM64 编译 (Docker 驱动)
        run: |
          BUILD_NAME="${{ github.event.inputs.build_name || 'proton-droid-arm64' }}"
          cd "$GITHUB_WORKSPACE/build-area"
          mkdir -p build && cd build
          
          echo "=== 执行配置脚本 (Target: arm64) ==="
          ../proton-source/configure.sh \
            --container-engine=docker \
            --target-arch=arm64 \
            --build-name="$BUILD_NAME" \
            --enable-ccache
          
          echo "=== 开始编译 (make -j4 redist) ==="
          make -j4 redist

      - name: 打包编译产物
        id: package
        run: |
          cd "$GITHUB_WORKSPACE/build-area/build"
          PKG_NAME="proton-droid-arm64-$(date +%Y%m%d).tar.gz"
          echo "=== 打包 redist 产物为 $PKG_NAME ==="
          tar -czvf "$GITHUB_WORKSPACE/$PKG_NAME" -C redist/ .
          
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "package_path=$GITHUB_WORKSPACE/$PKG_NAME" >> $GITHUB_OUTPUT
          
          echo "=== 产物打包完成 ==="
          ls -lh "$GITHUB_WORKSPACE/$PKG_NAME"

      - name: 上传产物到 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_path }}
          retention-days: 14

      - name: 自动创建 GitHub Release 发行版
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0-arm64-${{ github.run_number }}"
          name: "Proton 11 ARM64 Native Build #${{ github.run_number }}"
          body: |
            ### Proton 11 ARM64 原生构建产物
            - **架构**: aarch64 (Linux native) + arm64ec (Windows PE DXVK/VKD3D)
            - **集成组件**: Wine aarch64 + in-process FEX UnixLib + DXVK 2.x
            - **适配平台**: Android (Mali G610 / Adreno) + Termux/X11
            - **构建机器**: GitHub Actions `ubuntu-24.04-arm` (4-core ARM64)
          files: ${{ steps.package.outputs.package_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
