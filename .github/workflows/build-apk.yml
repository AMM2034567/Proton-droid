name: Build Proton-droid APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK 与 NDK
        uses: android-actions/setup-android@v3

      - name: 安装 CMake 与指定 NDK 27
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: 赋予 gradlew 执行权限
        run: |
          chmod +x gradlew

      - name: 编译 Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 上传 APK 到 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proton-droid-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 自动发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0-apk-${{ github.run_number }}"
          name: "Proton-droid App v1.0.0-alpha (Build #${{ github.run_number }})"
          body: |
            ### Proton-droid 正式版独立应用 (Phase 1)
            - **架构**: Kotlin + C++ NDK (ANativeWindow 视窗直通)
            - **特性**: 
              - 独立沙箱运行时管理（自动从 `/sdcard/Download/ProtonDroid/` 解包导入）
              - 前台保活服务（彻底免除 Android 14/15 缓存冻结）
              - 游戏快速扫描器
            - **适配环境**: Android 9.0+ (ARM64)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
