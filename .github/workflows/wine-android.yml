name: Build wine for Android (C 方案)

# C 方案（wineandroid.drv）的构建管线：产出 aarch64-android 版 wine + wine 自带 APK。
# 只在手动触发 / 打 tag 时运行（单次 30~90 分钟，不要挂在每次 push 上）。
on:
  workflow_dispatch:
    inputs:
      wine_ref:
        description: 'wine 源码 ref（tag 或分支）。master = 含上游分离进程改造的新模型（不打本地补丁）；wine-11.0 = 旧基线（打本地补丁）'
        required: false
        default: 'master'
      api_level:
        description: 'Android API level（NDK 目标）'
        required: false
        default: '28'
      with_x:
        description: '1 = 构建 winex11.drv（D/B'' 路线：内嵌 X + X11，Vulkan 走 VK_KHR_xlib_surface；需要 bionic X11 sysroot）'
        required: false
        default: '0'
  push:
    tags:
      - 'wine-android-*'

permissions:
  contents: write

jobs:
  build-wine-android:
    name: Build wine (aarch64-android)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出 Proton-droid
        uses: actions/checkout@v4

      - name: 释放磁盘空间（wine 构建需要大量空间）
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6].* /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 配置 JDK 17（gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装主机侧构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf bison flex pkg-config \
            gettext gcc-multilib libtool python3 git unzip wget \
            gcc-mingw-w64-x86-64
          echo "--- PE 编译器（wine configure 会优先选 mingw gcc，避免 clang 的 X86 汇编器崩溃）---"
          x86_64-w64-mingw32-gcc --version | head -1

      - name: 安装 gradle 8.x（wine 的 Android 构建硬性要求）
        run: |
          GRADLE_VER=8.7
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sf "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
          gradle --version | head -6

      - name: 安装 NDK 27
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "platform-tools"
          ls -d $ANDROID_HOME/ndk/*

      - name: 恢复缓存（wine 源码与两端构建目录，供增量编译）
        uses: actions/cache/restore@v4
        with:
          path: |
            wine-work/wine
            wine-work/build-host
            wine-work/build-android
          key: wine-cache-${{ github.event.inputs.wine_ref || 'wine-11.0' }}-${{ hashFiles('scripts/ci_build_wine_android.sh') }}
          restore-keys: |
            wine-cache-${{ github.event.inputs.wine_ref || 'wine-11.0' }}-

      - name: 构建 wine (aarch64-android)
        env:
          WINE_REF: ${{ github.event.inputs.wine_ref || 'wine-11.0' }}
          ANDROID_API: ${{ github.event.inputs.api_level || '28' }}
          # WITH_X=1 ⇒ 构建 winex11.drv（D/B' 路线：内嵌 X + X11 后端，Vulkan 才有 VK_KHR_xlib_surface）。
          # 需要 X11 sysroot（bionic）：由 WITH_X=1 时前面的步骤下载 Termux X11 包解出，路径走 X11_SYSROOT。
          WITH_X: ${{ github.event.inputs.with_x || '0' }}
          X11_SYSROOT: ${{ github.workspace }}/x11-sysroot
          JOBS: '4'
        run: |
          # 兜底：确保脚本是 LF（Windows 检出可能带 CRLF）
          sed -i 's/\r$//' scripts/ci_build_wine_android.sh
          chmod +x scripts/ci_build_wine_android.sh
          ./scripts/ci_build_wine_android.sh

      - name: 保存缓存（失败也存，下一轮才能增量）
        # actions/cache 的 post 步骤在任务失败时会跳过（run #5 实测 skipped）⇒ 显式 save + if: always()。
        # key 带 run_id 保证唯一；恢复侧靠 restore-keys 前缀命中，所以每次都拿最新一份。
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            wine-work/wine
            wine-work/build-host
            wine-work/build-android
            wine-work/x11sysroot
          key: wine-cache-${{ github.event.inputs.wine_ref || 'wine-11.0' }}-${{ hashFiles('scripts/ci_build_wine_android.sh') }}-run${{ github.run_id }}

      - name: 上传构建日志与产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-android-build
          path: |
            wine-out/*.log
            wine-out/artifacts/**
          if-no-files-found: warn
          retention-days: 14

      # 只含日志的小产物（几 MB）：整包 351MB 下载慢，而 API 抓日志会被截断 ⇒ 失败时靠这个定位
      - name: 上传纯日志（小产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-android-logs
          path: wine-out/*.log
          if-no-files-found: warn
          retention-days: 14

      # C2 真机迭代用：整包 351MB 下载太慢，这里单独给一份"只含 unix 库 + android 驱动"的小增量（~10MB），
      # 改动 wine 源码后只要把它解到设备上覆盖对应文件即可验证，不必重推 174MB 载荷。
      - name: 打包增量产物（unix 库 + wineandroid.drv）
        if: always()
        shell: bash
        run: |
          LIB=wine-out/wine-android-arm64/arm64-v8a/lib/wine
          if [ -d "$LIB" ]; then
            mkdir -p wine-out/delta
            tar czf wine-out/delta/wine-delta.tar.gz -C "$LIB" aarch64-unix aarch64-windows/winex11.drv aarch64-windows/wineandroid.drv 2>/dev/null \
              || tar czf wine-out/delta/wine-delta.tar.gz -C "$LIB" aarch64-unix 2>/dev/null || true
            # X11 运行时（DSO + locale）也塞进小产物，真机验证时一次下完
            [ -f wine-out/artifacts/x11-runtime-arm64.tar.gz ] && cp wine-out/artifacts/x11-runtime-arm64.tar.gz wine-out/delta/ || true
            ls -lh wine-out/delta || true
          else
            echo "(没有 $LIB，跳过增量打包)"
          fi

      - name: 上传增量产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-android-delta
          path: wine-out/delta/**
          if-no-files-found: warn
          retention-days: 14

      - name: 构建摘要
        if: always()
        run: |
          echo "### wine (aarch64-android) 构建" >> $GITHUB_STEP_SUMMARY
          for f in configure-host make-host configure-android make-android make-install; do
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>wine-out/$f.log (tail 25)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -25 "wine-out/$f.log" 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 关键错误行" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -hE 'error:|Error [0-9]|configure: error|No rule to make target|\*\*\*' wine-out/*.log 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
